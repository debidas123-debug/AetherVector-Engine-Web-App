[package]
name = "aethervector-desktop"
version = "1.0.0"
description = "AetherVector — Quantum Vector Engine"
authors = ["AetherVector"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aethervector_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
